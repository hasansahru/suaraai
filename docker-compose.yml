version: "3.8"

services:
  suaraai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suaraai-backend
    restart: always
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY:-sk-nine-router-free-ai-sahru}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-suaraai-super-secret-jwt-key-change-in-production}
    volumes:
      - ./backend/app/settings:/home/user/app/backend/app/settings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
