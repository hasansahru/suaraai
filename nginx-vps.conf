# Nginx Reverse Proxy Configuration untuk Suara AI Backend
# Letakkan file ini di /etc/nginx/sites-available/suaraai-api (atau ganti domain)

server {
    listen 80;
    server_name api.yourdomain.com; # Ganti dengan domain VPS Anda

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout panjang untuk proses generate video/audio/AI
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
